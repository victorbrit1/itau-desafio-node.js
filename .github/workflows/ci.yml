name: CI - Itau

on:
  push:
    branches:
      - main

# Controle de execuções simultâneas
concurrency:
  group: ghcr-itau-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Executar testes
        run: npm test

      - name: Fazer build da aplicação
        run: npm run build

      # inicio CD

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar nome da imagem
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Construir imagem Docker
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Publicar imagem no GHCR
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  deploy:
    name: CD - Deploy Azure
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Login na Azure via OIDC
        id: azure_login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Descobrir IP do runner
        id: ip
        run: |
          IP=$(curl -4 -fsS https://api.ipify.org)
          echo "address=$IP" >> "$GITHUB_OUTPUT"

      - name: Liberar SSH temporariamente
        env:
          RUNNER_IP: ${{ steps.ip.outputs.address }}
        run: |
          set -e

          az network nsg rule create \
            --resource-group rg-itau-demo \
            --nsg-name nsg-itau \
            --name github-deploy-temporario \
            --priority 250 \
            --direction Inbound \
            --access Allow \
            --protocol Tcp \
            --source-address-prefixes "$RUNNER_IP/32" \
            --destination-address-prefixes "*" \
            --destination-port-ranges 22 \
            --no-wait \
            --output none

          echo "Aguardando a regra ficar ativa..."

          for i in $(seq 1 20); do
            ESTADO=$(az network nsg rule show \
              --resource-group rg-itau-demo \
              --nsg-name nsg-itau \
              --name github-deploy-temporario \
              --query provisioningState \
              -o tsv 2>/dev/null) || ESTADO=""

            IP=$(az network nsg rule show \
              --resource-group rg-itau-demo \
              --nsg-name nsg-itau \
              --name github-deploy-temporario \
              --query sourceAddressPrefix \
              -o tsv 2>/dev/null) || IP=""

            if [ "$ESTADO" = "Succeeded" ] && [ "$IP" = "$RUNNER_IP/32" ]; then
              echo "Regra SSH criada com sucesso."
              exit 0
            fi

            sleep 5
          done

          echo "A regra SSH não ficou pronta."
          exit 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            cd /opt/itau-node

            docker compose pull app
            docker compose up -d --no-deps app

            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
                echo "Deploy concluido com sucesso!"
                exit 0
              fi
              sleep 2
            done

            docker compose logs --tail=50 app
            exit 1

      - name: Remover regra SSH temporária
        if: always() && steps.azure_login.outcome == 'success'
        run: |
          az network nsg rule delete \
            --resource-group rg-itau-demo \
            --nsg-name nsg-itau \
            --name github-deploy-temporario \
            --output none
