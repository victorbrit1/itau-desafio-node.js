name: CI - Itau

on:
  push:
    branches:
      - ci

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Executar testes
        run: npm test

      - name: Fazer build
        run: npm start

      - name: Build de imagem Docker
        run: docker build -t itau-api .