#cloud-config

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - docker.io
  - docker-compose-v2

runcmd:
  # Habilitar e iniciar o Docker
  - systemctl enable --now docker

  # Criar diretorio da aplicacao
  - mkdir -p /opt/itau-node

  # Permitir que azureuser gerencie os arquivos
  - chown azureuser:azureuser /opt/itau-node

  # Adicionar usuario ao grupo Docker
  - usermod -aG docker azureuser

  # Verificar instalacao
  - docker --version
  - docker compose version

final_message: "Cloud-init do projeto Itau finalizado!"